name: 💡 New Theory
description: Propose a theory about how a puzzle works or what it means
title: "[Theory] "
labels: ["theory", "discussion"]
body:
  - type: dropdown
    id: puzzle
    attributes:
      label: Puzzle
      options:
        - "Blue Prince: Boiler Room Panels"
        - "Blue Prince: Bookshop Compartment"
        - "Blue Prince: Castle, Court, Cloak"
        - "Blue Prince: Directory Paintings"
        - "Blue Prince: Dirigiblocks"
        - "Blue Prince: Does It Never End?"
        - "Blue Prince: Garage Acronym"
        - "Blue Prince: Hand Statues"
        - "Blue Prince: Hidden Letters"
        - "Blue Prince: Music Room"
        - "Blue Prince: Repeated Phrases"
        - "Blue Prince: The Eclipse"
        - "Blue Prince: The Missing 'I'"
        - "Blue Prince: These Vying Plans"
        - "Blue Prince: Tomb Candles"
        - "Blue Prince: True Draft"
        - "Noita: Hills 2 & the Microbiomes"
        - "Noita: Music-Attracted Animals"
        - "Noita: The 34-Orb QR Code"
        - "Noita: The Alchemy Symbol"
        - "Noita: The Broken Monoliths"
        - "Noita: The Cauldron Room"
        - "Noita: The Desert Ruins Markings"
        - "Noita: The Earthquake Circle"
        - "Noita: The Eye Puzzle"
        - "Noita: The Master Statues"
    validations:
      required: true

  - type: textarea
    id: theory
    attributes:
      label: Theory description
      description: Explain your theory clearly. What do you think is happening?
      placeholder: |
        I believe the cipher works by...
    validations:
      required: true

  - type: textarea
    id: related-issues
    attributes:
      label: Related findings or theories
      description: "Link existing issues this theory relates to. Type # to search, or paste URLs."
      placeholder: |
        This theory explains:
        - #42 (brute force repetition)
        - #43 (holding hands repetition)

  - type: textarea
    id: supporting-evidence
    attributes:
      label: Supporting evidence
      description: What findings or observations support this theory?
    validations:
      required: true

  - type: textarea
    id: predictions
    attributes:
      label: Testable predictions
      description: If your theory is correct, what else should be true? What can we test?
      placeholder: |
        If this theory is correct, then:
        - ...
        - ...

  - type: textarea
    id: weaknesses
    attributes:
      label: Known weaknesses
      description: What doesn't fit perfectly? What could disprove this?

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots (optional)
      description: Drag and drop images here to attach them.
