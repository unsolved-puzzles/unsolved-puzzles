name: 🔍 New Finding
description: Report a new discovery or observation for an existing puzzle
title: "[Finding] "
labels: ["finding", "needs-verification"]
body:
  - type: dropdown
    id: puzzle
    attributes:
      label: Puzzle
      description: Which puzzle does this relate to? If the puzzle isn't listed, use the "New Puzzle" template instead.
      options:
        - "Blue Prince: Music Room"
        - "Blue Prince: Does It Never End?"
        - "Blue Prince: Hand Statues"
        - "Blue Prince: Boiler Room"
        - "Blue Prince: Tomb Candles"
        - "Blue Prince: The Missing I"
        - "Blue Prince: Garage Acronym"
        - "Blue Prince: Hidden Letters"
        - "Blue Prince: Bookshop Compartment"
        - "Blue Prince: Dirigiblocks"
        - "Blue Prince: Repeated Phrases"
        - "Blue Prince: Castle Cloak Court"
        - "Noita: Eye Puzzle"
        - "Noita: The Cauldron Room"
    validations:
      required: true

  - type: textarea
    id: finding
    attributes:
      label: Describe your finding
      description: Be as specific as possible. What did you discover?
      placeholder: |
        I noticed that if you...
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence & Source
      description: Link to where this was first discussed (Reddit thread, Discord message, video) and any screenshots or reproduction steps.
      placeholder: |
        - Source: https://reddit.com/r/BluePrince/comments/...
        - Screenshot: [link]
        - Steps to reproduce: ...
    validations:
      required: true

  - type: textarea
    id: interpretation
    attributes:
      label: Your interpretation (optional)
      description: What do you think this means? Any theories?

  - type: dropdown
    id: confidence
    attributes:
      label: Confidence level
      options:
        - "High — I've verified this multiple times"
        - "Medium — seems consistent but needs more testing"
        - "Low — speculation based on limited data"
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots (optional)
      description: Drag and drop images here to attach them.
