name: ✏️ Suggest an Edit
description: Suggest a correction, debunk, status change, or addition to an existing puzzle page
title: "[Edit] "
labels: ["edit-suggestion"]
body:
  - type: dropdown
    id: puzzle
    attributes:
      label: Which puzzle page?
      options:
        - "Blue Prince: Music Room"
        - "Blue Prince: Does It Never End?"
        - "Blue Prince: Hand Statues"
        - "Blue Prince: Boiler Room"
        - "Blue Prince: Tomb Candles"
        - "Blue Prince: The Missing I"
        - "Blue Prince: Garage Acronym"
        - "Blue Prince: Hidden Letters"
        - "Blue Prince: Bookshop Compartment"
        - "Blue Prince: Dirigiblocks"
        - "Blue Prince: Repeated Phrases"
        - "Blue Prince: Castle Cloak Court"
        - "Noita: Eye Puzzle"
        - "Noita: The Cauldron Room"
        - "Other (specify below)"
    validations:
      required: true

  - type: dropdown
    id: edit-type
    attributes:
      label: Type of edit
      description: What kind of change are you suggesting?
      options:
        - "Debunk — disprove a finding or theory"
        - "Status change — mark as explained, confirmed, etc."
        - "Correction — fix an error in existing text"
        - "Addition — add missing information"
        - "Other"
    validations:
      required: true

  - type: input
    id: page-other
    attributes:
      label: Page URL or name (if "Other")
      description: Only fill this if the page isn't in the list above.
      placeholder: "https://unsolved-puzzles.github.io/unsolved-puzzles/..."

  - type: textarea
    id: related-issues
    attributes:
      label: Related issues
      description: "Link the finding or theory issue this edit targets. Type # to search, or paste URLs."
      placeholder: |
        #42 (the finding about brute force repetition)

  - type: textarea
    id: what-to-change
    attributes:
      label: What should be changed?
      description: Describe what's wrong or what should be added/corrected.
      placeholder: |
        The "brute force" finding should be marked as "explained" because...
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Evidence / Why?
      description: Why is this change needed? Link to a source if possible. For debunks, explain your counter-evidence.
      placeholder: |
        Source: https://discord.com/channels/...
        This is explained by the sledgehammer mechanic because...
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots (optional)
      description: Drag and drop images here to attach them.
