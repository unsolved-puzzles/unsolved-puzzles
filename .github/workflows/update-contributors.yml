name: Update Contributors

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-contributors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch contributors from GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Query recent issues and discussions for distinct logins
          LOGINS=$(gh api graphql -f query='
          {
            repository(owner: "unsolved-puzzles", name: "unsolved-puzzles") {
              issues(first: 100, orderBy: {field: UPDATED_AT, direction: DESC}) {
                nodes {
                  author { login }
                  comments(first: 50) {
                    nodes { author { login } }
                  }
                  reactions(first: 50) {
                    nodes { user { login } }
                  }
                }
              }
              discussions(first: 50, orderBy: {field: UPDATED_AT, direction: DESC}) {
                nodes {
                  author { login }
                  comments(first: 50) {
                    nodes { author { login } }
                  }
                  reactions(first: 50) {
                    nodes { user { login } }
                  }
                }
              }
            }
          }' --jq '
            [
              .data.repository.issues.nodes[].author.login,
              .data.repository.issues.nodes[].comments.nodes[].author.login,
              .data.repository.issues.nodes[].reactions.nodes[].user.login,
              .data.repository.discussions.nodes[].author.login,
              .data.repository.discussions.nodes[].comments.nodes[].author.login,
              .data.repository.discussions.nodes[].reactions.nodes[].user.login
            ] | map(select(. != null)) | unique | .[]
          ')

          # Merge new logins into existing CONTRIBUTORS file (append-only)
          touch CONTRIBUTORS
          echo "$LOGINS" | while read -r login; do
            if [ -n "$login" ] && ! grep -qx "$login" CONTRIBUTORS; then
              echo "$login" >> CONTRIBUTORS
            fi
          done

          # Sort the file for consistency
          sort -o CONTRIBUTORS CONTRIBUTORS

      - name: Update contributor count in index.html
        run: |
          COUNT=$(wc -l < CONTRIBUTORS | tr -d ' ')
          sed -i "s|<span class=\"stat-number\" id=\"stat-contributors\">[0-9]*</span>|<span class=\"stat-number\" id=\"stat-contributors\">$COUNT</span>|" index.html

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CONTRIBUTORS index.html
          git diff --cached --quiet || git commit -m "Update contributor count [skip ci]" && git push
