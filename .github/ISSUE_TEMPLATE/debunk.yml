name: ❌ Debunk
description: Present evidence that disproves a theory or corrects a finding
title: "[Debunk] "
labels: ["debunk", "needs-review"]
body:
  - type: textarea
    id: target
    attributes:
      label: What are you debunking?
      description: "Type # to search for an issue, or paste a link to the finding/theory."
      placeholder: "#12 — ROT-7 cipher theory"
    validations:
      required: true

  - type: textarea
    id: counter-evidence
    attributes:
      label: Counter-evidence
      description: Why is the original claim wrong? Provide specific evidence and a source (Reddit thread, Discord link, screenshot, video).
      placeholder: |
        The theory fails because...
        Source: https://reddit.com/r/BluePrince/comments/...
    validations:
      required: true

  - type: textarea
    id: methodology
    attributes:
      label: How you tested
      description: What steps did you take to verify this is wrong?
    validations:
      required: true

  - type: textarea
    id: alternative
    attributes:
      label: Alternative explanation (optional)
      description: If the original claim is wrong, what might the correct answer be?

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots (optional)
      description: Drag and drop images here to attach them.
